[package]
name = "joshua_api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "uuid", "chrono","tls-rustls-ring"] }
uuid = { version = "1", features = ["serde", "v4","v7"] }
serde = { version = "1.0.228", features = ["derive"] }
jsonwebtoken = { version = "10", features = ["use_pem"] }
reqwest = { version = "0.13.4",default-features = false, features = ["json","rustls-no-provider"] }
dotenvy = "0.15.7"
load-dotenv = "0.1.2"
tokio = "1.52.3"
thiserror = "2.0.18"
serde_json = "1.0.150"
actix-cors = "0.7.1"
log = "0.4.32"
env_logger = "0.11.11"
rustls = "0.23"
webpki-roots = "1.0.8"